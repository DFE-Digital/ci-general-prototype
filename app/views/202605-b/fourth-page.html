 <div class="govuk-grid-row">

 <div class="govuk-form-group ">

             <label class="govuk-label govuk-label--l" id="project-rationale-label" for="project-rationale">

          </h1>

             <button type="button" class="app-word-toolbar__btn app-word-toolbar__btn--underline" id="project-rationale-underline" data-format="underline" title="Underline" aria-keyshortcuts="Control+U">U</button>
          </div>
          <div class="app-word-toolbar__group" role="group" aria-label="Lists">

 </div>

<script>
(function () {
  var STORAGE_KEY = 'prototypePrepare:202605b:projectRationaleHtml';
  var editor = document.getElementById('project-rationale');
  var store = document.getElementById('project-rationale-data');
  var toolbar = document.querySelector('.app-word-toolbar');
  if (!editor || !store || !toolbar) return;

  function syncToStore() {
    store.value = editor.innerHTML;
    try {
      sessionStorage.setItem(STORAGE_KEY, editor.innerHTML);
    } catch (err) {
      /* quota or private mode */
    }
  }

  editor.addEventListener('input', syncToStore);
  editor.addEventListener('blur', syncToStore);

  var form = editor.closest('form');
  if (form) {
    form.addEventListener('submit', syncToStore);
  }

  toolbar.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) {
      e.preventDefault();
    });
  });

  function runCommand(command) {
    editor.focus();
    try {
      document.execCommand(command, false, null);
    } catch (err) {
      /* execCommand unsupported */
    }
    syncToStore();
  }

  toolbar.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-format]');
    if (!btn) return;
    e.preventDefault();
    var f = btn.getAttribute('data-format');
    if (f === 'bold') runCommand('bold');
    else if (f === 'italic') runCommand('italic');
    else if (f === 'underline') runCommand('underline');
    else if (f === 'bullet') runCommand('insertUnorderedList');
    else if (f === 'numbered') runCommand('insertOrderedList');
  });

  editor.addEventListener('keydown', function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    var k = e.key.toLowerCase();
    if (k === 'b') {
      e.preventDefault();
      runCommand('bold');
    } else if (k === 'i') {
      e.preventDefault();
      runCommand('italic');
    } else if (k === 'u') {
      e.preventDefault();
      runCommand('underline');
    }
  });

  var saveBtn = document.getElementById('save-and-continue-button');
  if (saveBtn) {
    saveBtn.addEventListener('click', syncToStore);
  }

  editor.innerHTML = '';
  syncToStore();
})();
</script>

{% endblock %}
